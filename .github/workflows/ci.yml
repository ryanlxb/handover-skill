name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static validation
        run: python3 -I tests/validate_handover.py handover
      - name: Fixture tests
        run: python3 -I tests/run_fixture_tests.py
